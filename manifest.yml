modules:
  jira:projectPage:
    - key: qualityloop-samples
      resource: sample-page
      resolver:
        function: sample-resolver
      render: native
      title: QualityLoop
  jira:adminPage:
    - key: qualityloop-data
      resource: data-page
      resolver:
        function: data-resolver
      render: native
      title: QualityLoop data
      displayConditions:
        isAdmin: true
  trigger:
    - key: qualityloop-issue-deleted
      function: issue-deleted
      events:
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
  jira:issuePanel:
    - key: qualityloop-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: qualityloop
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:issueContext:
    - key: qualityloop-evidence-context
      resource: evidence-context
      resolver:
        function: resolver
      render: native
      title: QualityLoop evidence
      label: QualityLoop evidence
  jira:entityPropertySet:
    - key: qualityloop-properties
      properties:
        - entityType: issue
          propertyKey: qualityloop
          values:
            - path: recordType
              type: string
              searchAlias: qlRecordType
            - path: partNorm
              type: string
              searchAlias: qlPart
            - path: partBase
              type: string
              searchAlias: qlPartBase
            - path: failureMode
              type: string
              searchAlias: qlFailureMode
            - path: supplier
              type: string
              searchAlias: qlSupplier
            - path: detectedDate
              type: date
              searchAlias: qlDetected
            - path: closedDate
              type: date
              searchAlias: qlClosed
        - entityType: issue
          propertyKey: qualityloop-probe
          values:
            - path: token
              type: string
              searchAlias: qlProbeToken
  function:
    - key: resolver
      handler: index.handler
    - key: sample-resolver
      handler: index.sampleHandler
    - key: data-resolver
      handler: index.adminHandler
    - key: issue-deleted
      handler: index.onIssueDeleted
resources:
  - key: sample-page
    path: src/frontend/projectPage.jsx
  - key: data-page
    path: src/frontend/adminPage.jsx
  - key: main
    path: src/frontend/index.jsx
  - key: evidence-context
    path: src/frontend/issueContext.jsx
  - key: probe-clipboard
    path: static/probe-clipboard/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  storage:
    entities:
      - name: pair-state
        attributes:
          capaId:
            type: string
          issueId:
            type: string
          version:
            type: integer
          state:
            type: string
          latestDecisionId:
            type: string
          updatedAt:
            type: string
        indexes:
          - name: by-issue
            partition:
              - issueId
            range:
              - updatedAt
          - name: by-capa
            partition:
              - capaId
            range:
              - updatedAt
      - name: decision
        attributes:
          type:
            type: string
          capaId:
            type: string
          issueId:
            type: string
          reason:
            type: string
          reasonCategory:
            type: string
          evidenceLinks:
            type: any
          authorAccountId:
            type: string
          createdAt:
            type: string
          taskKey:
            type: string
          taskClaimId:
            type: string
        indexes:
          - name: by-issue
            partition:
              - issueId
            range:
              - createdAt
          - name: by-capa
            partition:
              - capaId
            range:
              - createdAt
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3b6c6550-90d9-4bc5-a3a6-9388240baf81
